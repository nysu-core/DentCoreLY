# OrthoCore — Nginx reverse proxy configuration
# Place this file at: /etc/nginx/sites-available/orthocore
# Then: sudo ln -s /etc/nginx/sites-available/orthocore /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# To add HTTPS (free via Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com;           # ← replace with your domain or IP

    # ── Frontend (React build output) ──────────────────────────────────
    root /opt/orthocore/frontend/dist;
    index index.html;

    # Serve the SPA — all non-API routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeouts for PDF generation and large file uploads
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Allow large file uploads (matches backend 25 MB limit)
        client_max_body_size 30M;
    }

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"         always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection "1; mode=block"     always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ───────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # ── Cache static assets ────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
