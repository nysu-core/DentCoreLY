[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api"
  to = "https://dentcorely.vercel.app/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://dentcorely.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200